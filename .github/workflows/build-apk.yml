name: Build Android 16 APK & Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: platform-tools

    - name: Grant Execute Permission for Gradle Wrapper
      run: chmod +x ./SCR_Case_Book_Android/gradlew

    - name: Build Debug APK
      run: |
        cd SCR_Case_Book_Android
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK as Workflow Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SCR-Case-Book-APK
        path: SCR_Case_Book_Android/app/build/outputs/apk/debug/app-debug.apk

    - name: Create GitHub Release with APK
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: v1.0.0
        name: "SCR Case Book v1.0.0 (Android 16 APK)"
        body: |
          ### SCR Case Book Android 16 Release
          - Android 16 (API 36 / Baklava) Compatible
          - Dual-Engine: Jetpack Compose Native + High-Performance WebView Container
          - Direct download link below:
        files: SCR_Case_Book_Android/app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
